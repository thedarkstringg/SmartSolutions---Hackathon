<!-- Browser Extension Popup Container (Simulated) -->
<!-- Applying "Shell Visibility & Relevance (THE FILTER)" Rule: Suppressing full navs for a transactional/compact view. -->
<div class="w-[360px] bg-surface text-on-surface rounded-xl flex flex-col shadow-2xl relative overflow-hidden border border-outline-variant/30">

<header class="flex justify-between items-center px-4 py-3 border-b border-outline-variant/30 bg-surface-dim/80 backdrop-blur-md z-10">
<div class="flex items-center gap-2">

<span class="font-title-sm text-title-sm font-bold tracking-tight text-on-surface">Tilloff</span>
</div>
<button aria-label="Settings" class="text-on-surface-variant hover:text-on-surface transition-colors flex items-center justify-center p-1">
<span class="material-symbols-outlined text-[20px]">settings</span>
</button>
</header>
<!-- Main Content Area -->
<main class="flex-1 p-4 flex flex-col gap-4 bg-surface z-0">
<!-- Primary Status Module (Mathematical Precision & Tonal Layering) -->
<section class="flex flex-col py-5 px-4 bg-[#1C2541] border border-outline-variant/20 rounded-lg relative overflow-hidden group">
<!-- Subtle grid background for high-tech institutional feel -->
<div class="absolute inset-0 opacity-[0.03] pointer-events-none" style="background-image: linear-gradient(to right, #ffffff 1px, transparent 1px), linear-gradient(to bottom, #ffffff 1px, transparent 1px); background-size: 8px 8px;"></div>
<div class="relative z-10 flex items-start justify-between w-full">
<div class="flex flex-col">
<h1 class="font-headline-md text-headline-md text-on-surface tracking-tight leading-none mb-1">Protected</h1>
<span class="font-body-sm text-body-sm text-primary">Active Threat Shield</span>
</div>
<div class="w-10 h-10 rounded-full bg-primary-container/30 border border-primary/20 flex items-center justify-center">
<span class="material-symbols-outlined text-primary text-[24px]" style="font-variation-settings: 'FILL' 1;">shield_locked</span>
</div>
</div>
<div class="relative z-10 mt-6 flex items-end gap-2">
<span class="font-display-lg text-display-lg text-on-surface leading-none tracking-tighter">99.9</span>
<div class="flex flex-col pb-1">
<span class="font-mono-data text-mono-data text-on-surface-variant">%</span>
<span class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-widest">Confidence Index</span>
</div>
</div>
<!-- Confidence Gauge -->
<div class="w-full h-1 bg-surface-container-highest mt-4 rounded-full overflow-hidden relative z-10">
<div class="h-full bg-primary w-[99.9%]"></div>
</div>
</section>
<!-- Analysis Heuristics (Mini-Bento Grid) -->
<section class="flex flex-col gap-2">
<h2 class="font-label-caps text-label-caps text-on-surface-variant mb-1 uppercase tracking-widest px-1">Analysis Heuristics</h2>
<div class="grid grid-cols-2 gap-2">
<!-- URL Verification (Full width, primary heuristic) -->
<div class="col-span-2 flex flex-col p-3 bg-surface-container rounded border border-outline-variant/20 relative overflow-hidden">
<div class="absolute top-0 right-0 w-16 h-16 bg-primary/5 rounded-bl-[32px] pointer-events-none"></div>
<div class="flex items-center justify-between mb-2 z-10">
<div class="flex items-center gap-2 text-on-surface-variant">
<span class="material-symbols-outlined text-[16px]">link</span>
<span class="font-label-caps text-label-caps uppercase">URL Topology</span>
</div>
<div class="flex items-center gap-1 text-primary">
<span class="material-symbols-outlined text-[14px]" style="font-variation-settings: 'FILL' 1;">verified</span>
<span class="font-mono-data text-mono-data">Verified</span>
</div>
</div>
<span class="font-body-sm text-body-sm text-on-surface truncate z-10 font-mono-data">app.tilloff.enterprise.net</span>
</div>

<div class="flex flex-col p-3 bg-surface-container rounded border border-outline-variant/20">
<div class="flex items-center justify-between mb-2">
<span class="material-symbols-outlined text-on-surface-variant text-[16px]">visibility</span>
